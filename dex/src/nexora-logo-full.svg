<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="nxLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="nxGradLeft" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>

    <linearGradient id="nxGradDiag" x1="10" y1="10" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#22d3ee" />
    </linearGradient>

    <linearGradient id="nxGradRight" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>

    <radialGradient id="nxShieldBase" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#181729" />
      <stop offset="100%" stopColor="#0a0a14" />
    </radialGradient>

    <linearGradient id="nxShieldBorder" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="rgba(192, 132, 252, 0.45)" />
      <stop offset="50%" stopColor="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stopColor="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <linearGradient id="nxWordGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Monogram Icon -->
  <g transform="translate(2, 2)">
    <!-- Outer Shield -->
    <path d="M 22 3 L 39 12 L 39 33 L 22 42 L 5 33 L 5 12 Z" fill="url(#nxShieldBase)" stroke="url(#nxShieldBorder)" stroke-width="1.2" />
    
    <!-- Inner Monogram -->
    <g filter="url(#nxLogoGlow)">
      <path d="M 12 11.5 C 12 10.8 12.5 10.3 13.2 10.3 L 16.8 10.3 C 17.5 10.3 18 10.8 18 11.5 L 18 33.5 C 18 34.2 17.5 34.7 16.8 34.7 L 13.2 34.7 C 12.5 34.7 12 34.2 12 33.5 Z" fill="url(#nxGradLeft)" />
      <path d="M 14.7 10.8 L 30.8 31.7 C 31.5 32.6 32.4 32.6 32.9 31.8 L 32.9 28 L 17.4 7.2 C 16.5 6.3 15.4 6.5 14.7 7.8 Z" fill="url(#nxGradDiag)" />
      <path d="M 27 11.5 C 27 10.8 27.5 10.3 28.2 10.3 L 31.8 10.3 C 32.5 10.3 33 10.8 33 11.5 L 33 33.5 C 33 34.2 32.5 34.7 31.8 34.7 L 28.2 34.7 C 27.5 34.7 27 34.2 27 33.5 Z" fill="url(#nxGradRight)" />
      <circle cx="33.8" cy="8.6" r="2" fill="#38bdf8" />
      <circle cx="33.8" cy="8.6" r="0.9" fill="#ffffff" />
    </g>
  </g>

  <!-- Wordmark Text -->
  <text x="56" y="31" font-family="'Sora', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="2.4">
    <tspan fill="#FFFFFF">NEX</tspan><tspan fill="url(#nxWordGrad)">ORA</tspan>
  </text>
</svg>
